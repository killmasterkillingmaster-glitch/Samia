name: Manga Processing Pipeline

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Telegram File ID'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      msg_id:
        description: 'Telegram Message ID'
        required: true
      user_id:
        description: 'Telegram User ID'
        required: true
      lang:
        description: 'Language Target'
        required: true
      style:
        description: 'Typeset Style'
        required: true
      fname:
        description: 'Original Filename'
        required: true
      mode:
        description: 'Execution Mode (extract/render)'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'Samia-main/requirements.txt'

      # ==========================================
      # 🚀 FFMPEG CACHING (Zero Redownload)
      # ==========================================
      - name: Cache FFmpeg Static Binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/ffmpeg-binary
          key: ffmpeg-static-v6.0

      - name: Install Static FFmpeg if not cached
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin/ffmpeg-binary
          cd ~/.local/bin/ffmpeg-binary
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz --strip-components=1
          rm ffmpeg-release-amd64-static.tar.xz

      - name: Add FFmpeg to PATH
        run: |
          echo "$HOME/.local/bin/ffmpeg-binary" >> $GITHUB_PATH

      # ==========================================
      # 📦 PYTHON DEPENDENCIES INSTALLATION
      # ==========================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Samia-main/requirements.txt

      # ==========================================
      # ⚡ EXECUTE SCRIPT
      # ==========================================
      - name: Run Encoding / Extraction Engine
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          USER_ID: ${{ github.event.inputs.user_id }}
          FILE_ID: ${{ github.event.inputs.file_id }}
          TASK_MODE: ${{ github.event.inputs.mode }}
          LANG: ${{ github.event.inputs.lang }}
          STYLE: ${{ github.event.inputs.style }}
          FNAME: ${{ github.event.inputs.fname }}
        run: |
          python Samia-main/encorder.py
