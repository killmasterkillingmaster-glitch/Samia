name: Encode and Hardsub Pipeline

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: 'Task Type (compress or hardsub)'
        required: true
      video_id:
        description: 'Telegram Video Link'
        required: true
      sub_id:
        description: 'Subtitle Link'
        required: false
        default: 'none'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      user_id:
        description: 'Telegram User ID'
        required: true
      resolution:
        description: 'Video Resolution'
        required: false
        default: 'none'
      wm_id:
        description: 'Watermark Link'
        required: false
        default: 'none'
      wm_pos:
        description: 'Watermark Position'
        required: false
        default: 'none'
      rename:
        description: 'Custom Output Name'
        required: false
        default: 'none'
      font_link:
        description: 'Custom Font Link'
        required: false
        default: 'none'
      trigger_msg_id:
        description: 'Trigger Status Message ID'
        required: false
        default: 'none'

# Strict Queue: One task at a time
concurrency:
  group: encoding-single-queue
  cancel-in-progress: false

jobs:
  encode_job:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Auto kill if stuck

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      # ==========================================
      # 🚀 FAST NATIVE FFMPEG & MULTI-THREADING
      # ==========================================
      - name: Install System Dependencies & Native FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg mediainfo libass-dev

      # ==========================================
      # 📦 FAST PYTHON DEPENDENCIES
      # ==========================================
      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; elif [ -f "Samia-main/requirements.txt" ]; then pip install -r Samia-main/requirements.txt; fi

      # ==========================================
      # ⚡ EXECUTE ENCODER SCRIPT
      # ==========================================
      - name: Run Encoding Worker
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          SUB_ID: ${{ github.event.inputs.sub_id }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          USER_ID: ${{ github.event.inputs.user_id }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          WM_ID: ${{ github.event.inputs.wm_id }}
          WM_POS: ${{ github.event.inputs.wm_pos }}
          RENAME: ${{ github.event.inputs.rename }}
          FONT_LINK: ${{ github.event.inputs.font_link }}
          TRIGGER_MSG_ID: ${{ github.event.inputs.trigger_msg_id }}
        run: |
          if [ -f "encorder.py" ]; then python encorder.py; elif [ -f "Samia-main/encorder.py" ]; then python Samia-main/encorder.py; fi
