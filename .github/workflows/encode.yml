name: Encode and Hardsub Pipeline

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: 'Task Type (compress or hardsub)'
        required: true
      video_id:
        description: 'Telegram Video Link'
        required: true
      sub_id:
        description: 'Subtitle Link'
        required: false
        default: 'none'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      user_id:
        description: 'Telegram User ID'
        required: true
      resolution:
        description: 'Video Resolution'
        required: false
        default: 'none'
      wm_id:
        description: 'Watermark Link'
        required: false
        default: 'none'
      wm_pos:
        description: 'Watermark Position'
        required: false
        default: 'none'
      rename:
        description: 'Custom Output Name'
        required: false
        default: 'none'
      font_link:
        description: 'Custom Font Link'
        required: false
        default: 'none'
      trigger_msg_id:
        description: 'Trigger Status Message ID'
        required: false
        default: 'none'

jobs:
  encode_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'Samia-main/requirements.txt'

      # ==========================================
      # 🚀 FFMPEG CACHING (Zero Redownload)
      # ==========================================
      - name: Cache FFmpeg Static Binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/ffmpeg-binary
          key: ffmpeg-static-v6.0

      - name: Install Static FFmpeg if not cached
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin/ffmpeg-binary
          cd ~/.local/bin/ffmpeg-binary
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz --strip-components=1
          rm ffmpeg-release-amd64-static.tar.xz

      - name: Add FFmpeg to PATH
        run: |
          echo "$HOME/.local/bin/ffmpeg-binary" >> $GITHUB_PATH

      # ==========================================
      # 📦 PYTHON DEPENDENCIES INSTALLATION
      # ==========================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Samia-main/requirements.txt

      # ==========================================
      # ⚡ EXECUTE ENCODER SCRIPT
      # ==========================================
      - name: Run Encoding Worker
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          SUB_ID: ${{ github.event.inputs.sub_id }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          USER_ID: ${{ github.event.inputs.user_id }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          WM_ID: ${{ github.event.inputs.wm_id }}
          WM_POS: ${{ github.event.inputs.wm_pos }}
          RENAME: ${{ github.event.inputs.rename }}
          FONT_LINK: ${{ github.event.inputs.font_link }}
          TRIGGER_MSG_ID: ${{ github.event.inputs.trigger_msg_id }}
        run: |
          python Samia-main/encorder.py
